<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セクター資金移動マップ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background: radial-gradient(ellipse at center, #0d0d1a 0%, #000000 100%);
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(138, 43, 226, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(0, 100, 255, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 0, 150, 0.05) 0%, transparent 50%);
            animation: nebula 30s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes nebula {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.1); }
        }

        .container {
            display: grid;
            grid-template-columns: minmax(800px, 1fr) 280px;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
            max-width: 100vw;
            position: relative;
            z-index: 10;
        }

        .main-section {
            position: relative;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
            grid-column: 1;
            grid-row: 1 / 3;
        }

        header {
            padding: 1.5rem 2.5rem 1rem;
            z-index: 10;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .date-range {
            font-size: 0.9rem;
            color: #666;
            font-weight: 300;
        }

        .galaxy-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding-bottom: 60px;
        }

        .galaxy-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 750px;
            height: 750px;
        }

        /* セクターローテーション - 光の輪 */
        @keyframes rotate {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* 個別の回転速度用アニメーション */
        @keyframes rotate-fast { 
            from { transform: rotate(0deg); } 
            to { transform: rotate(360deg); } 
        }
        @keyframes rotate-medium { 
            from { transform: rotate(0deg); } 
            to { transform: rotate(360deg); } 
        }
        @keyframes rotate-slow { 
            from { transform: rotate(0deg); } 
            to { transform: rotate(360deg); } 
        }
        @keyframes rotate-very-slow { 
            from { transform: rotate(0deg); } 
            to { transform: rotate(360deg); } 
        }

        @keyframes glow-pulse {
            0%, 100% {
                filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.6));
            }
            50% {
                filter: drop-shadow(0 0 15px rgba(0, 255, 136, 0.9));
            }
        }

        .rotation-arrows {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 720px;
            height: 720px;
            pointer-events: none;
        }

        .cycle-label {
            position: absolute;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8), 0 2px 4px rgba(0, 0, 0, 0.9);
            padding: 0.4rem 0.8rem;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .cycle-label.top { top: 80px; right: 80px; }
        .cycle-label.right { bottom: 80px; right: 80px; }
        .cycle-label.bottom { bottom: 80px; left: 80px; }
        .cycle-label.left { top: 80px; left: 80px; }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #00ff88;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 700;
            background: rgba(0, 255, 136, 0.05);
            z-index: 100;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .center-circle:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }

        .center-circle.negative-market {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.05);
        }

        .center-label {
            font-size: 0.9rem;
            margin-bottom: 0.2rem;
        }

        .center-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #888;
            margin-bottom: 0.2rem;
        }

        .center-value {
            font-size: 1.3rem;
            font-weight: 900;
            color: #00ff88;
        }

        .center-value.negative {
            color: #ff4444;
        }

        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(0, 255, 136, 0.08);
            border-radius: 50%;
            box-shadow: 
                0 0 10px rgba(0, 255, 136, 0.1),
                inset 0 0 10px rgba(0, 255, 136, 0.05);
            animation: orbit-pulse 4s ease-in-out infinite;
        }

        @keyframes orbit-pulse {
            0%, 100% { 
                border-color: rgba(0, 255, 136, 0.08);
                box-shadow: 0 0 10px rgba(0, 255, 136, 0.1), inset 0 0 10px rgba(0, 255, 136, 0.05);
            }
            50% { 
                border-color: rgba(0, 255, 136, 0.15);
                box-shadow: 0 0 20px rgba(0, 255, 136, 0.2), inset 0 0 15px rgba(0, 255, 136, 0.1);
            }
        }

        .orbit-1 { width: 250px; height: 250px; animation-delay: 0s; }
        .orbit-2 { width: 450px; height: 450px; animation-delay: 1s; }
        .orbit-3 { width: 650px; height: 650px; animation-delay: 2s; }
        .orbit-4 { width: 750px; height: 750px; animation-delay: 3s; }

        .sector {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid;
            will-change: transform;
        }

        .sector.positive {
            background: radial-gradient(circle at 30% 30%, rgba(0, 255, 136, 0.95), rgba(0, 255, 136, 0.7), rgba(0, 255, 136, 0.4), rgba(0, 255, 136, 0.2));
            border-color: rgba(0, 255, 136, 0.8);
            box-shadow: 
                0 2px 8px rgba(0, 255, 136, 0.3),
                0 6px 20px rgba(0, 255, 136, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                inset 0 -1px 3px rgba(0, 0, 0, 0.3),
                inset -2px -2px 6px rgba(0, 0, 0, 0.2),
                inset 2px 2px 6px rgba(255, 255, 255, 0.15);
        }

        .sector.negative {
            background: radial-gradient(circle at 30% 30%, rgba(255, 68, 68, 0.95), rgba(255, 68, 68, 0.7), rgba(255, 68, 68, 0.4), rgba(255, 68, 68, 0.2));
            border-color: rgba(255, 68, 68, 0.8);
            box-shadow: 
                0 2px 8px rgba(255, 68, 68, 0.3),
                0 6px 20px rgba(255, 68, 68, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                inset 0 -1px 3px rgba(0, 0, 0, 0.3),
                inset -2px -2px 6px rgba(0, 0, 0, 0.2),
                inset 2px 2px 6px rgba(255, 255, 255, 0.15);
        }

        .sector:hover {
            transform: scale(1.15) translateY(-2px);
            z-index: 50;
        }

        .sector.positive:hover {
            box-shadow: 
                0 4px 12px rgba(0, 255, 136, 0.5),
                0 8px 30px rgba(0, 255, 136, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.5),
                inset 0 -1px 3px rgba(0, 0, 0, 0.3),
                inset -2px -2px 6px rgba(0, 0, 0, 0.2),
                inset 2px 2px 6px rgba(255, 255, 255, 0.2);
        }

        .sector.negative:hover {
            box-shadow: 
                0 4px 12px rgba(255, 68, 68, 0.5),
                0 8px 30px rgba(255, 68, 68, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.5),
                inset 0 -1px 3px rgba(0, 0, 0, 0.3),
                inset -2px -2px 6px rgba(0, 0, 0, 0.2),
                inset 2px 2px 6px rgba(255, 255, 255, 0.2);
        }

        .sector.highlighted {
            transform: scale(1.15);
            z-index: 60;
            filter: brightness(1.2);
        }

        .sector-label {
            text-align: center;
            line-height: 1.2;
            filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.9)) drop-shadow(0 1px 2px rgba(0, 0, 0, 1));
            text-shadow: 
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000,
                0 0 5px rgba(0, 0, 0, 0.8);
        }

        .sector-icon {
            font-size: 1.3rem;
            margin-bottom: 0.25rem;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }

        .sector-name {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            line-height: 1.3;
        }

        .sector-value {
            display: block;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.01em;
            margin-top: 0.1rem;
        }

        .rotating-ring {
            position: absolute;
            border: 5px solid;
            border-radius: 50%;
            border-color: transparent transparent rgba(255, 255, 255, 0.95) rgba(255, 255, 255, 0.95);
            pointer-events: none;
            animation: rotateRing 0.6s linear infinite;
            box-shadow: 
                0 0 30px rgba(255, 255, 255, 0.8),
                inset 0 0 20px rgba(255, 255, 255, 0.5);
            filter: brightness(1.5) drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
        }

        @keyframes rotateRing {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .sector-tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00ff88;
            border-radius: 8px;
            padding: 1rem 1.2rem;
            font-size: 0.75rem;
            color: #fff;
            pointer-events: auto;
            z-index: 200;
            max-width: 350px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 255, 136, 0.4);
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(15px);
        }

        .sector-tooltip.negative-sector {
            border-color: #ff4444;
            box-shadow: 0 8px 32px rgba(255, 68, 68, 0.4);
        }

        .sector-tooltip.negative-sector .tooltip-title {
            color: #ff4444;
            border-bottom-color: rgba(255, 68, 68, 0.3);
        }

        .sector-tooltip.negative-sector .tooltip-stock {
            border-left-color: rgba(255, 68, 68, 0.3);
        }

        .sector-tooltip.negative-sector .tooltip-stock:hover {
            background: rgba(255, 68, 68, 0.1);
            border-left-color: #ff4444;
        }

        .sector-tooltip.visible {
            opacity: 1;
        }

        .sector-tooltip::-webkit-scrollbar {
            width: 6px;
        }

        .sector-tooltip::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .sector-tooltip::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 3px;
        }

        .tooltip-title {
            font-weight: 700;
            color: #00ff88;
            margin-bottom: 0.7rem;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
            padding-bottom: 0.5rem;
        }

        .tooltip-subtitle {
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 0.5rem;
        }

        .tooltip-stock {
            color: #ddd;
            margin: 0.3rem 0;
            padding: 0.4rem 0.6rem;
            border-left: 2px solid rgba(0, 255, 136, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .tooltip-stock:hover {
            background: rgba(0, 255, 136, 0.1);
            border-left-color: #00ff88;
        }

        .stock-name-code {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .stock-name {
            font-weight: 600;
        }

        .stock-code-cap {
            font-size: 0.65rem;
            color: #888;
            margin-top: 0.1rem;
        }

        .stock-change {
            font-weight: 700;
            font-size: 0.7rem;
            margin-left: 0.8rem;
        }

        .stock-change.positive {
            color: #00ff88;
        }

        .stock-change.negative {
            color: #ff4444;
        }

        .particle {
            position: absolute;
            width: 16px;
            height: 16px;
            pointer-events: none;
            font-size: 16px;
            line-height: 16px;
            opacity: 0.5;
            will-change: transform, opacity;
        }

        .sidebar {
            background: #0f0f0f;
            border-left: 1px solid #222;
            padding: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            grid-column: 2;
            grid-row: 1 / 3;
        }

        /* タブナビ */
        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }
        .sidebar-tab {
            flex: 1;
            padding: 0.75rem 0.4rem;
            background: none;
            border: none;
            color: #555;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }
        .sidebar-tab:hover { color: #aaa; }
        .sidebar-tab.active {
            color: #00ff88;
            border-bottom-color: #00ff88;
        }

        /* タブパネル共通 */
        .sidebar-panel {
            padding: 0.8rem 0.5rem;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* 銘柄分析：検索ボックス */
        .stock-search-box {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }
        .stock-code-input {
            flex: 1;
            padding: 8px 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .stock-code-input:focus { border-color: #00ff88; }
        .stock-search-btn {
            padding: 8px 14px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #0a0a0a;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .stock-search-btn:hover { opacity: 0.85; }

        /* 銘柄分析：結果カード */
        .stock-header {
            margin-bottom: 12px;
        }
        .stock-name {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
        }
        .stock-code-badge {
            font-size: 0.72rem;
            color: #555;
        }
        .stock-price-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin: 6px 0 12px;
        }
        .stock-price-big {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
        }
        .stock-change-big {
            font-size: 1rem;
            font-weight: 700;
        }
        .stock-change-big.pos { color: #00ff88; }
        .stock-change-big.neg { color: #ff4444; }

        .analysis-section-title {
            font-size: 0.72rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 12px 0 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid #1e1e1e;
        }

        /* 期間パフォーマンスグリッド */
        .perf-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 4px;
        }
        .perf-cell {
            background: #141414;
            border-radius: 6px;
            padding: 7px 8px;
            text-align: center;
        }
        .perf-period {
            font-size: 0.65rem;
            color: #555;
            margin-bottom: 2px;
        }
        .perf-value {
            font-size: 0.88rem;
            font-weight: 700;
        }
        .perf-value.pos { color: #00ff88; }
        .perf-value.neg { color: #ff4444; }
        .perf-value.neu { color: #666; }

        /* 指標テーブル */
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #141414;
            font-size: 0.82rem;
        }
        .metric-row:last-child { border-bottom: none; }
        .metric-label { color: #666; }
        .metric-value { color: #ccc; font-weight: 600; }

        .news-container {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .news-container::-webkit-scrollbar {
            width: 6px;
        }

        .news-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .news-container::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 3px;
        }

        .news-item {
            margin-bottom: 1rem;
            padding: 0.9rem;
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid #00ff88;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .news-item:hover {
            background: rgba(0, 255, 136, 0.15);
            transform: translateX(-5px);
        }
        
        .news-item.negative:hover {
            background: rgba(255, 68, 68, 0.15);
        }

        .news-item.negative {
            border-left-color: #ff4444;
        }

        .news-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .news-icon {
            display: inline-block;
            margin-right: 0.5rem;
        }

        .news-sector {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 0.3rem;
        }

        .news-content {
            font-size: 0.8rem;
            line-height: 1.5;
            color: #aaa;
            margin-bottom: 0.5rem;
        }

        .news-time {
            font-size: 0.7rem;
            color: #666;
        }

        .news-source {
            font-size: 0.7rem;
            color: #555;
            font-style: italic;
            margin-top: 0.4rem;
        }

        .market-indicators {
            position: fixed;
            left: 2rem;
            top: 7.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 8px;
            padding: 0.5rem 0.6rem;
            backdrop-filter: blur(20px);
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            min-width: auto;
        }

        .indicator {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin: 0.15rem 0;
        }

        .indicator-name {
            font-size: 0.65rem;
            color: #888;
            min-width: auto;
        }

        .indicator-value {
            font-size: 0.8rem;
            font-weight: 700;
            color: #00ff88;
        }

        .indicator-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0.6rem 0;
            min-width: 200px;
        }

        .indicator-label {
            font-size: 0.8rem;
            color: #888;
            margin-right: 1rem;
        }

        .indicator-value {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .indicator-price {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
        }

        .indicator-change {
            font-size: 0.7rem;
            font-weight: 700;
            margin-top: 0.2rem;
        }

        .indicator-change.positive {
            color: #00ff88;
        }

        .indicator-change.negative {
            color: #ff4444;
        }

        .company-detail-panel {
            position: fixed;
            width: 280px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #00ff88;
            border-radius: 8px;
            padding: 1rem 1.2rem;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 255, 136, 0.4);
        }

        .company-detail-panel.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .detail-close {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: none;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .detail-close:hover {
            color: #fff;
        }

        .detail-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #00ff88;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            margin: 0.7rem 0;
            font-size: 0.85rem;
        }

        .detail-label {
            color: #888;
        }

            min-height: 90px;
            justify-content: center;
        }

            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.02em;
            text-align: center;
            min-width: 300px;
            display: flex;
            justify-content: center;
        }

            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.85rem;

        .timeline-range-arrow {

        .timeline-date {
            padding: 0.35rem 0.9rem;

            font-weight: 600;
            transition: all 0.3s ease;
            min-width: 80px;
            text-align: center;
        }

        .timeline-date:hover {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .period-selector {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 0.6rem;
            width: 100%;
            max-width: 600px;
        }

        .period-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .period-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .period-btn:hover::before {
            left: 100%;
        }

        .period-btn:hover {
            background: rgba(0, 255, 136, 0.05);
            border-color: rgba(0, 255, 136, 0.3);
            color: #00ff88;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.2);

        .period-btn.active {

            border-color: transparent;

                0 4px 15px rgba(0, 255, 136, 0.3),

        }

        .period-btn.active::before {
            display: none;
        }

</head>

        // 簡易的なセクターデータ生成
        function generateSimpleSectorData(volatility) {
            const sectorNames = Object.keys(SECTOR_ROTATION_POS);
            return sectorNames.map(name => {
                const companies = COMPANY_DATABASE[name] || [];
                return {
                    name: name,
                    value: (Math.random() - 0.5) * volatility,
                    stocks: companies.length > 0 ? companies : [
                        { name: `${name}株1`, code: "0000", cap: 1.0, change: (Math.random() - 0.5) * volatility }
                    ]
                };
            });
        }

        SECTORS = generateSimpleSectorData(3);

        function getSectorColor(value) {
            if (value >= 0) return 'positive';
            return 'negative';
        }

        function createSectors() {
            const galaxy = document.getElementById('galaxy');
            galaxy.querySelectorAll('.sector').forEach(el => el.remove());
            
            const centerX = 375;
            const centerY = 375;
            
            // セクターデータに位置情報を追加
            const sectorsWithPos = SECTORS.map(sector => {
                const pos = SECTOR_ROTATION_POS[sector.name];
                if (!pos) return null;
                
                const marketCapSize = Math.sqrt(sector.stocks.reduce((sum, s) => sum + s.cap, 1)) * 16.5;
                const size = Math.max(55, Math.min(110, marketCapSize));
                
                return { ...sector, ...pos, size, marketCapSize };
            }).filter(s => s !== null);
            
            // 配置（重なり検出なし）
            const finalPositions = sectorsWithPos.map((sector) => {
                const angleRad = (sector.angle * Math.PI) / 180;
                const radius = sector.radius;
                
                const x = centerX + radius * Math.cos(angleRad);
                const y = centerY + radius * Math.sin(angleRad);
                
                return { ...sector, x, y, radius, angleRad };
            });
            
            // 実際に配置
            finalPositions.forEach((sector) => {
                const sectorEl = document.createElement('div');
                sectorEl.className = `sector ${getSectorColor(sector.value)}`;
                sectorEl.style.width = `${sector.size}px`;
                sectorEl.style.height = `${sector.size}px`;
                sectorEl.style.left = `${sector.x - sector.size / 2}px`;
                sectorEl.style.top = `${sector.y - sector.size / 2}px`;
                sectorEl.dataset.name = sector.name;
                
                const icon = SECTOR_ICONS[sector.name] || "📊";
                
                sectorEl.innerHTML = `
                    <div class="sector-label">
                        <div class="sector-icon">${icon}</div>
                        <span class="sector-name">${sector.name}</span>
                        <span class="sector-value">${sector.value > 0 ? '+' : ''}${sector.value.toFixed(1)}%</span>
                    </div>
                `;
                
                sectorEl.addEventListener('mouseenter', (e) => {
                    showSectorTooltip(sector, e.currentTarget);
                });
                
                sectorEl.addEventListener('mouseleave', () => {
                    hideSectorTooltip();
                    // 企業詳細パネルも閉じる

                        const panel = document.getElementById('company-detail');
                        if (panel && !panel.matches(':hover')) {
                            panel.classList.remove('visible');
                        }
                    }, 300);
                });
                
                galaxy.appendChild(sectorEl);
            });
        }

        // 大きな粒子＋到着時大エフェクト
        function createParticles() {
            const galaxy = document.getElementById('galaxy');
            
            setInterval(() => {
                const losers = SECTORS.filter(s => s.value < 0);
                const winners = SECTORS.filter(s => s.value > 0);
                
                if (losers.length === 0 || winners.length === 0) return;
                
                // ペア数を削減（3→2）
                for (let pair = 0; pair < 2; pair++) {
                    const loser = losers[Math.floor(Math.random() * losers.length)];
                    const winner = winners[Math.floor(Math.random() * winners.length)];
                    
                    const loserEl = document.querySelector(`[data-name="${loser.name}"]`);
                    const winnerEl = document.querySelector(`[data-name="${winner.name}"]`);
                    
                    if (!loserEl || !winnerEl) continue;
                    
                    const startX = loserEl.offsetLeft + loserEl.offsetWidth / 2;
                    const startY = loserEl.offsetTop + loserEl.offsetHeight / 2;
                    const endX = winnerEl.offsetLeft + winnerEl.offsetWidth / 2;
                    const endY = winnerEl.offsetTop + winnerEl.offsetHeight / 2;
                    
                    // 変動率に応じた粒子数の計算（±2%上限、0.25%刻み）
                    const loserChange = Math.abs(loser.value); // マイナスの絶対値
                    const winnerChange = Math.abs(winner.value); // プラスの絶対値
                    const avgChange = Math.min((loserChange + winnerChange) / 2, 2.0); // 2%で上限
                    
                    // 0.25%刻みで段階的に粒子数を増やす（1個減らす）
                    // 0-0.24%: 1個, 0.25%: 2個, 0.5%: 3個, 0.75%: 4個, 1.0%: 5個, 1.25%: 6個, 1.5%: 7個, 1.75%: 8個, 2.0%: 9個
                    const particleCount = Math.max(1, Math.min(9, Math.floor(avgChange / 0.25) + 1));
                    
                    for (let i = 0; i < particleCount; i++) {
                        setTimeout(() => {
                            const particle = document.createElement('div');
                            particle.className = 'particle';
                            
                            // ランダムなお金アイコンを選択（💴💰🪙）
                            const moneyIcons = ['💴', '💰', '🪙'];
                            particle.textContent = moneyIcons[Math.floor(Math.random() * moneyIcons.length)];
                            
                            particle.style.left = `${startX - 8}px`;
                            particle.style.top = `${startY - 8}px`;
                            galaxy.appendChild(particle);
                            
                            const duration = 4200 + Math.random() * 1800;  // 20%遅く（3500→4200、5000→6000）
                            const startTime = Date.now();
                            
                            const curveX = (Math.random() - 0.5) * 50;
                            const curveY = (Math.random() - 0.5) * 50;
                            
                            function animate() {
                                const elapsed = Date.now() - startTime;
                                const progress = Math.min(elapsed / duration, 1);
                                
                                // リニア（一定速度）で移動
                                const easeProgress = progress;
                                
                                const t = easeProgress;
                                const currentX = Math.pow(1-t, 2) * startX + 
                                               2 * (1-t) * t * (startX + curveX) + 
                                               Math.pow(t, 2) * endX;
                                const currentY = Math.pow(1-t, 2) * startY + 
                                               2 * (1-t) * t * (startY + curveY) + 
                                               Math.pow(t, 2) * endY;
                                
                                particle.style.left = `${currentX - 8}px`;
                                particle.style.top = `${currentY - 8}px`;
                                
                                if (progress < 1) {
                                    requestAnimationFrame(animate);
                                } else {
                                    // 到着した粒子と同じアイコンで1個だけポップ
                                    const arrivalIcon = particle.textContent;
                                    createBigArrivalEffect(endX, endY, arrivalIcon);
                                    particle.remove();
                                }
                            }
                            
                            animate();
                        }, i * 100);
                    }
                }
            }, 500); // 2.0回/秒
        }

        function createBigArrivalEffect(x, y, icon) {
            const galaxy = document.getElementById('galaxy');
            
            // 1個だけポップ
            const spark = document.createElement('div');
            spark.className = 'particle';
            spark.textContent = icon; // 到着したアイコンと同じものを使用
            spark.style.left = `${x - 8}px`;
            spark.style.top = `${y - 8}px`;
            spark.style.opacity = 1;
            galaxy.appendChild(spark);
            
            // 上方向に跳ねる
            const angleVariation = (Math.random() - 0.5) * 40;
            const angle = (-90 + angleVariation) * Math.PI / 180;
            const maxHeight = 20 + Math.random() * 10;
            const lateralMove = Math.cos(angle) * 8;
            
            const startTime = Date.now();
            const duration = 800;
            
            function animateSpark() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // バウンス効果（放物線運動）
                const bounce = Math.sin(progress * Math.PI);
                const currentY = y - maxHeight * bounce;
                const currentX = x + lateralMove * progress;
                
                spark.style.left = `${currentX - 8}px`;
                spark.style.top = `${currentY - 8}px`;
                
                // スケールアニメーション（回転なし・サイズ半分）
                const scaleProgress = progress < 0.5 ? progress * 2 : (1 - progress) * 2;
                const scale = 0.9 + scaleProgress * 0.6;
                spark.style.transform = `scale(${scale})`;
                
                // フェードアウト
                if (progress > 0.7) {
                    spark.style.opacity = (1 - progress) / 0.3;
                } else {
                    spark.style.opacity = 1;
                }
                
                if (progress < 1) {
                    requestAnimationFrame(animateSpark);
                } else {
                    spark.remove();
                }
            }
            
            animateSpark();
        }

        // ニュースとセクターのマッチング関数
        function matchNewsToSectors(newsTitle, newsContent) {
            const matchedSectors = [];
            const text = (newsTitle + " " + newsContent).toLowerCase();
            
            for (const [sector, keywords] of Object.entries(SECTOR_KEYWORDS)) {
                for (const keyword of keywords) {
                    if (text.includes(keyword.toLowerCase())) {
                        if (!matchedSectors.includes(sector)) {
                            matchedSectors.push(sector);
                        }
                        break; // このセクターは既にマッチしたので次へ
                    }
                }
            }
            
            return matchedSectors;
        }

        const PERIOD_SECS = {
            '1w':    5 * 86400,
            '1m':   30 * 86400,
            '3m':   90 * 86400,
            '6m':  180 * 86400,
            '1y':  365 * 86400,
            '3y':  3 * 365 * 86400,
            '5y':  5 * 365 * 86400,
            '10y': 10 * 365 * 86400,
        };
        // 後方互換（1d 判定などで参照される箇所のみ残す）
        const PERIOD_MAP = {
            '1d': { range: '1d', interval: '5m' },
        };

        // Yahoo Finance は flat数値 または {raw, fmt} オブジェクトの両方を返す場合がある
        function extractNum(val) {
            if (typeof val === 'number') return val;
            if (val && typeof val === 'object' && 'raw' in val) return val.raw;
            return 0;
        }

        // 疎通テスト
        async function checkYahooFinance() {
            try {
                const url = PROXY + encodeURIComponent(`${YF_URL}?symbols=^N225`);
                const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
                const json = await res.json();
                return !!(json.quoteResponse?.result?.length);
            } catch {
                return false;
            }
        }

        // 複数ティッカーを分割してバッチ取得
        async function fetchYahooBatch(tickers) {
            const results = {};
            for (let i = 0; i < tickers.length; i += YF_BATCH) {
                const batch   = tickers.slice(i, i + YF_BATCH);
                const symbols = batch.join(',');                            // ← カンマ区切りのまま渡す（後でencodeURIComponentが一括エンコード）
                try {
                    const url  = PROXY + encodeURIComponent(`${YF_URL}?symbols=${symbols}`);
                    const res  = await fetch(url);
                    const json = await res.json();
                    for (const item of (json.quoteResponse?.result || [])) {
                        const code = item.symbol.replace('.T', '');
                        results[code] = {
                            change: parseFloat(extractNum(item.regularMarketChangePercent).toFixed(2)),
                            price:  extractNum(item.regularMarketPrice),
                        };
                    }
                } catch (e) {
                    console.warn('YF バッチエラー:', e);
                }
            }
            return results;
        }

        // Spark API（バッチ対応・任意期間の始値→終値変化率を計算）
        async function fetchSparkBatch(tickers, range, interval) {
            const results = {};
            for (let i = 0; i < tickers.length; i += YF_BATCH) {
                const batch   = tickers.slice(i, i + YF_BATCH);
                const symbols = batch.join(',');
                try {
                    const url  = PROXY + encodeURIComponent(
                        `${YF_SPARK_URL}?symbols=${symbols}&range=${range}&interval=${interval}`
                    );
                    const res  = await fetch(url);
                    const json = await res.json();
                    for (const item of (json.spark?.result || [])) {
                        const resp   = item.response?.[0];
                        if (!resp) continue;
                        const closes = (resp.indicators?.quote?.[0]?.close || []).filter(v => v != null);
                        if (closes.length < 2) continue;
                        const first  = closes[0];
                        const last   = closes[closes.length - 1];
                        const change = parseFloat(((last - first) / first * 100).toFixed(2));
                        const code   = item.symbol.replace('.T', '');
                        results[code] = {
                            change,
                            price: extractNum(resp.meta?.regularMarketPrice) || last,
                        };
                    }
                } catch (e) {
                    console.warn('Spark バッチエラー:', e);
                }
            }
            return results;
        }

        // ─── v8 chart API（タイムスタンプ方式・interval=1wk 廃止で全銘柄対応）
        async function fetchChartOne(ticker, period) {
            try {
                const now      = Math.floor(Date.now() / 1000);
                const secs     = PERIOD_SECS[period];
                const interval = PERIOD_INTERVAL[period] || '1d';
                // period1/period2 方式（range= の方言差を回避）
                const query = secs
                    ? `period1=${now - secs}&period2=${now}&interval=${interval}`
                    : `range=max&interval=1mo`;
                const url  = PROXY + encodeURIComponent(
                    `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?${query}`
                );
                const res  = await fetch(url);
                const json = await res.json();
                const result = json.chart?.result?.[0];
                if (!result) return null;
                const closes = (result.indicators?.quote?.[0]?.close || []).filter(v => v != null);
                if (closes.length < 2) return null;
                const first = closes[0];
                const last  = closes[closes.length - 1];
                return {
                    change: parseFloat(((last - first) / first * 100).toFixed(2)),
                    price:  extractNum(result.meta?.regularMarketPrice) || last,
                };
            } catch { return null; }
        }

        // 期間変化率キャッシュ（5分 TTL）
        const PCACHE     = {};
        const PCACHE_TTL = 5 * 60 * 1000;

        // 複数銘柄を CHART_CONC 本ずつ並列取得＋キャッシュ（レート制限対策）
        const CHART_CONC = 4;
        async function fetchPeriodChanges(tickers, period) {
            const results = {};
            const ts      = Date.now();
            for (let i = 0; i < tickers.length; i += CHART_CONC) {
                const batch = tickers.slice(i, i + CHART_CONC);
                const vals  = await Promise.all(batch.map(async t => {
                    const key    = `${t}|${period}`;
                    const cached = PCACHE[key];
                    if (cached && ts - cached.at < PCACHE_TTL) return cached.v;
                    const v = await fetchChartOne(t, period);
                    if (v) PCACHE[key] = { v, at: ts };
                    return v;
                }));
                batch.forEach((ticker, idx) => {
                    if (vals[idx] !== null) results[ticker.replace('.T', '')] = vals[idx];
                });
            }
            return results;
        }

        // 全セクターデータを Yahoo Finance から構築（期間対応）
        async function buildSectorDataFromYahoo(period = '1m') {
            const allCodes = new Set();
            for (const companies of Object.values(COMPANY_DATABASE)) {
                for (const c of companies) allCodes.add(`${c.code}.T`);
            }

            // ─── Step1: quote API で全銘柄の現在価格・当日変化率を取得（5分キャッシュ）
            if (!buildSectorDataFromYahoo._qCache ||
                Date.now() - buildSectorDataFromYahoo._qAt > 5 * 60 * 1000) {
                const fresh = await fetchYahooBatch([...allCodes]);
                if (Object.keys(fresh).length > 0) {
                    buildSectorDataFromYahoo._qCache = fresh;
                    buildSectorDataFromYahoo._qAt    = Date.now();
                }
            }
            const quoteMap = buildSectorDataFromYahoo._qCache || {};

            // ─── Step2: 1d 以外は各セクター代表銘柄（時価総額最大 1 銘柄）を
            //           Chart v8 API（タイムスタンプ方式）で並列取得＋キャッシュ
            const sparkMap = {};
            if (period !== '1d') {
                const seen     = new Set();
                const repCodes = [];
                for (const companies of Object.values(COMPANY_DATABASE)) {
                    if (!companies.length) continue;
                    const rep = companies.reduce((a, b) => (a.cap > b.cap ? a : b));
                    if (!seen.has(rep.code)) {
                        seen.add(rep.code);
                        repCodes.push(`${rep.code}.T`);
                    }
                }
                Object.assign(sparkMap, await fetchPeriodChanges(repCodes, period));
            }

            return Object.keys(SECTOR_ROTATION_POS).map(sectorName => {
                const companies = COMPANY_DATABASE[sectorName] || [];

                // 個別株: 現在価格と当日変化率は quote API から（確実に取れる）
                const stocks = companies.map(c => ({
                    ...c,
                    change: (quoteMap[c.code]?.change ?? 0),
                    price:  (quoteMap[c.code]?.price  ?? 0),
                }));
                const totalCap = stocks.reduce((s, c) => s + c.cap, 0);

                // セクター集計変化率: Spark（期間）優先、失敗時は当日加重平均にフォールバック
                let value;
                if (period !== '1d') {
                    const rep      = companies.length ? companies.reduce((a, b) => (a.cap > b.cap ? a : b)) : null;
                    const sparkVal = rep ? sparkMap[rep.code] : undefined;
                    value = sparkVal !== undefined
                        ? sparkVal.change
                        : (totalCap > 0 ? parseFloat((stocks.reduce((s, c) => s + c.change * c.cap, 0) / totalCap).toFixed(2)) : 0);
                } else {
                    value = totalCap > 0
                        ? parseFloat((stocks.reduce((s, c) => s + c.change * c.cap, 0) / totalCap).toFixed(2))
                        : 0;
                }

                return { name: sectorName, value, stocks };
            });
        }

        // 市場指数を Yahoo Finance から取得（期間対応）
        async function fetchMarketFromYahoo(period = '1m') {
            const idxSymbols = ['^N225', '1306.T', '2516.T', 'JPY=X'];

            if (period === '1d') {
                // 当日は quote API（正式な前日比）
                const url  = PROXY + encodeURIComponent(`${YF_URL}?symbols=${idxSymbols.join(',')}`);
                const res  = await fetch(url);
                const json = await res.json();
                const map  = {};
                for (const item of (json.quoteResponse?.result || [])) {
                    map[item.symbol] = {
                        price:  extractNum(item.regularMarketPrice),
                        change: parseFloat(extractNum(item.regularMarketChangePercent).toFixed(2)),
                    };
                }
                return { nikkei: map['^N225'], topix: map['1306.T'], growth: map['2516.T'], usdjpy: map['JPY=X'] };
            } else {
                // その他の期間は Chart v8 API（タイムスタンプ方式・キャッシュ付き）
                const changes = await fetchPeriodChanges(idxSymbols, period);
                return {
                    nikkei: changes['^N225'],
                    topix:  changes['1306'],
                    growth: changes['2516'],
                    usdjpy: changes['JPY=X'],
                };
            }
        }

        // リアルタイム株価 + 市場指数を一括更新
        async function fetchRealTimeAll() {
            const btn = document.getElementById('realtime-btn');
            btn.textContent = '📡 取得中...';

            try {
                const [marketData, newSectors] = await Promise.all([

                    buildSectorDataFromYahoo(currentPeriod),
                ]);

                const gotMarketData = Object.values(marketData).some(v => v);
                if (gotMarketData) {
                    setServerUI(true);

                    setServerUI(false);
                }

                    SECTORS = newSectors;
                    createSectors();
                    // リアル市場データが無い場合のみセクター平均で推計する
                    if (!gotMarketData) updateNikkeiAverage();
                }

                // リアル市場データはセクター計算の後に適用（上書き防止）
                if (gotMarketData) applyMarketData(marketData);

                    `最終更新: ${new Date().toLocaleTimeString('ja-JP')}`;

                btn.textContent = '✅ 更新完了';
                setTimeout(() => { btn.textContent = '📡 リアルタイム株価更新'; btn.disabled = false; }, 2000);

            } catch (e) {

                setServerUI(false);
                btn.textContent = '❌ 取得失敗';
                setTimeout(() => { btn.textContent = '📡 リアルタイム株価更新'; btn.disabled = false; }, 3000);
            }
        }

        // 市場指数を UI に反映（market-indicators パネルは削除済みのため null-safe）
        const $ = id => document.getElementById(id);
        function applyMarketData(data) {

        // ============================================================
        // ニュース取得関数（APIあり→リアルニュース、なし→デモ）
        // ============================================================
        async function fetchNews(evt) {
            const button = (evt && evt.target) ? evt.target : document.getElementById('news-btn');
            button.textContent = '🔄 取得中...';
            button.disabled = true;

            // デモフォールバック用データ（最上位スコープに置くことで finally でも参照可能）
            const demoNews = [
                { title: "トヨタ、新型EVを2025年発売へ",       content: "トヨタ自動車は次世代電気自動車の開発を加速。バッテリー技術の革新により航続距離を大幅に延長。", change: "+2.5%", time: "10分前",  link: "" },
                { title: "日銀、金利政策を据え置き",             content: "日本銀行は金融政策決定会合で政策金利の据え置きを決定。三菱UFJ、三井住友などメガバンクの株価に影響。", change: "-0.8%", time: "25分前",  link: "" },
                { title: "ソニー、AI半導体に1兆円投資",          content: "ソニーグループはAI向け半導体事業に1兆円を投資。次世代センサーとイメージング技術を強化。",             change: "+3.2%", time: "1時間前", link: "" },
                { title: "NTT、6G研究開発を本格化",              content: "NTTは次世代通信規格6Gの研究開発を加速。2030年の実用化を目指す。",                                   change: "+1.5%", time: "2時間前", link: "" },
                { title: "武田薬品、新型抗がん剤の承認取得",     content: "武田薬品工業は新しい抗がん剤の国内承認を取得。がん治療の新たな選択肢として期待。",                   change: "+2.1%", time: "3時間前", link: "" },
                { title: "JR東海、リニア開業延期の可能性",       content: "JR東海はリニア中央新幹線の開業時期について、工事の遅れから延期の可能性を示唆。",                     change: "-1.3%", time: "4時間前", link: "" },
            ];

            let newsWithSectors;
            let fetchedReal = false;

            try {
                // corsproxy.io + DOMParser で RSS を直接取得（rss2json.com の制限を回避）
                const rssFeeds = [
                    { url: 'https://www3.nhk.or.jp/rss/news/cat6.xml', source: 'NHK経済' },
                    { url: 'https://www3.nhk.or.jp/rss/news/cat1.xml', source: 'NHKニュース' },
                    { url: 'https://feeds.reuters.com/reuters/businessNews', source: 'Reuters' },
                ];

                for (const feed of rssFeeds) {
                    if (fetchedReal) break;
                    try {
                        const fetchPromise = fetch(PROXY + encodeURIComponent(feed.url));
                        const timeoutPromise = new Promise((_, reject) =>
                            setTimeout(() => reject(new Error('timeout')), 8000)
                        );
                        const res  = await Promise.race([fetchPromise, timeoutPromise]);
                        const text = await res.text();

                        // XML パース（ブラウザ標準の DOMParser を使用）
                        const parser = new DOMParser();
                        const doc    = parser.parseFromString(text, 'text/xml');
                        if (doc.querySelector('parsererror')) continue;

                        const items = [...doc.querySelectorAll('item')];
                        if (!items.length) continue;

                        fetchedReal = true;
                        newsWithSectors = items.slice(0, 20).map(item => {
                            const title   = item.querySelector('title')?.textContent?.trim() || '';
                            const link    = item.querySelector('link')?.textContent?.trim()  || '';
                            const pubDate = item.querySelector('pubDate')?.textContent?.trim() || '';
                            const rawDesc = item.querySelector('description')?.textContent || '';
                            const content = rawDesc.replace(/<[^>]+>/g, '').trim().slice(0, 150);
                            let timeStr = '';
                            if (pubDate) {
                                try {
                                    const diffMin = Math.floor((Date.now() - new Date(pubDate).getTime()) / 60000);
                                    if (diffMin < 60)        timeStr = `${diffMin}分前`;
                                    else if (diffMin < 1440) timeStr = `${Math.floor(diffMin / 60)}時間前`;
                                    else                     timeStr = `${Math.floor(diffMin / 1440)}日前`;
                                } catch { timeStr = ''; }
                            }
                            const sectors = matchNewsToSectors(title, content);
                            return { title, content, change: '', time: timeStr, link, source: feed.source, sectors };
                        }).filter(n => n.title);
                    } catch (e) {
                        console.warn(`RSS フィード ${feed.source} 失敗:`, e);
                    }
                }

                // 全フィード失敗 → デモデータにフォールバック
                if (!newsWithSectors) {
                    newsWithSectors = demoNews.map(n => ({ ...n, sectors: matchNewsToSectors(n.title, n.content) }));
                }

                NEWS = newsWithSectors;
                createNews();

                button.textContent = fetchedReal ? `✅ ニュース取得完了` : '✅ デモデータ表示';
                setTimeout(() => {
                    button.textContent = '🔄 ニュース取得';
                    button.disabled = false;
                }, 1500);

            } catch (e) {
                // 予期しないエラーでもボタンを必ずリセット
                console.error('ニュース取得エラー:', e);
                NEWS = demoNews.map(n => ({ ...n, sectors: matchNewsToSectors(n.title, n.content) }));
                createNews();
                button.textContent = '✅ デモデータ表示';
                setTimeout(() => {
                    button.textContent = '🔄 ニュース取得';
                    button.disabled = false;
                }, 1500);
            }
        }

        function createNews() {
            const container = document.getElementById('news-container');
            container.innerHTML = '';

            NEWS.forEach(news => {
                const isNegative = typeof news.change === 'string' && news.change.startsWith('-');
                const newsEl = document.createElement('div');
                newsEl.className = `news-item ${isNegative ? 'negative' : ''}`;

                // セクター情報を表示（複数セクター対応）
                const sectorsText = news.sectors && news.sectors.length > 0
                    ? news.sectors.slice(0, 3).join(', ') + (news.sectors.length > 3 ? ' 他' : '')
                    : '全般';

                const icon = news.sectors && news.sectors.length > 0
                    ? SECTOR_ICONS[news.sectors[0]] || '📊'
                    : '📊';

                const changeLabel = news.change ? ` ${news.change}` : '';
                const sourceLabel = news.source ? `<span style="color:#555;margin-left:6px;">${news.source}</span>` : '';
                const titleHtml = news.link
                    ? `<a href="${news.link}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;">${news.title}</a>`
                    : news.title;

                newsEl.innerHTML = `
                    <div class="news-title">${titleHtml}</div>
                    <div class="news-sector">
                        <span class="news-icon">${icon}</span>
                        ${sectorsText}${changeLabel}${sourceLabel}
                    </div>
                    <div class="news-content">${news.content}</div>
                    <div class="news-time">${news.time}</div>
                `;
                
                newsEl.addEventListener('mouseenter', function() {
                    if (news.sectors && news.sectors.length > 0) {
                        highlightSectors(news.sectors);
                    }
                });
                
                newsEl.addEventListener('mouseleave', function() {
                    clearHighlights();
                });
                
                container.appendChild(newsEl);
            });
        }

                    sectorEl.classList.add('highlighted');
                    
                    const ring = document.createElement('div');
                    ring.className = 'rotating-ring';

                    const ringSize = sectorSize + 30;
                    
                    ring.style.width = `${ringSize}px`;
                    ring.style.height = `${ringSize}px`;
                    ring.style.position = 'absolute';
                    ring.style.left = `${parseFloat(sectorEl.style.left) + sectorSize / 2}px`;
                    ring.style.top = `${parseFloat(sectorEl.style.top) + sectorSize / 2}px`;
                    
                    ring.dataset.sectorName = name;
                    galaxy.appendChild(ring);
                }
            });

            if (left < 10) {
                left = rect.right + 15;

            if (left + tooltipRect.width > window.innerWidth - 10) {
                left = window.innerWidth - tooltipRect.width - 10;

            if (top < 10) {

        function initTimeline() {
            const periodBtns = document.querySelectorAll('.period-btn');
            const timelineCurrent = document.getElementById('timeline-current');
            const timelineStart = document.getElementById('timeline-start');
            const timelineEnd = document.getElementById('timeline-end');
            
            // currentPeriod はグローバル変数（line 1258）を使用
            let currentMonth = new Date();

            // 期間ボタン
            periodBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    periodBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentPeriod = btn.dataset.period;  // グローバル変数を更新
                    updateTimelineDisplay();
                    fetchRealTimeAll();  // 期間変更のたびにデータ再取得
                });
            });
            
            function updateTimelineDisplay() {
                const year = currentMonth.getFullYear();
                const month = currentMonth.getMonth() + 1;
                const day = currentMonth.getDate();
                
                // 期間によって表示を変更
                if (currentPeriod === '1d') {
                    timelineCurrent.textContent = `${year}年${month}月${day}日`;
                } else if (currentPeriod === '1w') {
                    timelineCurrent.textContent = `${year}年${month}月 第${Math.ceil(day/7)}週`;
                } else if (currentPeriod === '1m') {
                    timelineCurrent.textContent = `${year}年${month}月`;
                } else if (currentPeriod === '3m') {
                    timelineCurrent.textContent = `${year}年 Q${Math.ceil(month/3)}`;
                } else if (currentPeriod === '6m') {
                    timelineCurrent.textContent = `${year}年 ${month <= 6 ? '上期' : '下期'}`;
                } else if (currentPeriod === '1y') {
                    timelineCurrent.textContent = `${year}年`;
                } else if (currentPeriod === '3y') {
                    timelineCurrent.textContent = `${year-1}〜${year+1}年`;
                } else if (currentPeriod === '5y') {
                    timelineCurrent.textContent = `${year-2}〜${year+2}年`;
                } else if (currentPeriod === '10y') {
                    timelineCurrent.textContent = `${year-5}〜${year+4}年`;
                } else if (currentPeriod === 'max') {
                    timelineCurrent.textContent = '全期間';
                }
                
                // 開始・終了日の計算
                let startDate = new Date(currentMonth);
                let endDate = new Date(currentMonth);
                
                if (currentPeriod === '1d') {
                    endDate = new Date(startDate);
                } else if (currentPeriod === '1w') {
                    endDate.setDate(startDate.getDate() + 7);
                } else if (currentPeriod === '1m') {
                    startDate.setDate(1);
                    endDate = new Date(startDate);
                    endDate.setMonth(endDate.getMonth() + 1);
                    endDate.setDate(0);
                } else if (currentPeriod === '3m') {
                    startDate.setMonth(startDate.getMonth() - 1);
                    endDate.setMonth(startDate.getMonth() + 3);
                } else if (currentPeriod === '6m') {
                    startDate.setMonth(startDate.getMonth() - 3);
                    endDate.setMonth(startDate.getMonth() + 6);
                } else if (currentPeriod === '1y') {
                    startDate.setMonth(0, 1);
                    endDate.setMonth(11, 31);
                } else if (currentPeriod === '3y') {
                    startDate.setFullYear(startDate.getFullYear() - 1, 0, 1);
                    endDate.setFullYear(startDate.getFullYear() + 3, 11, 31);
                } else if (currentPeriod === '5y') {
                    startDate.setFullYear(startDate.getFullYear() - 2, 0, 1);
                    endDate.setFullYear(startDate.getFullYear() + 5, 11, 31);
                } else if (currentPeriod === '10y') {
                    startDate.setFullYear(startDate.getFullYear() - 5, 0, 1);
                    endDate.setFullYear(startDate.getFullYear() + 10, 11, 31);
                } else if (currentPeriod === 'max') {
                    startDate = new Date(2000, 0, 1);
                    endDate = new Date();
                }
                
                timelineStart.textContent = `${startDate.getFullYear()}/${startDate.getMonth() + 1}/${startDate.getDate()}`;
                timelineEnd.textContent = `${endDate.getFullYear()}/${endDate.getMonth() + 1}/${endDate.getDate()}`;
            }
            
            updateTimelineDisplay();
        }

        async function analyzeStock() {
            const input   = document.getElementById('stock-code-input');
            const rawCode = input.value.trim().replace(/[^0-9A-Za-z]/g, '');
            if (!rawCode) { input.focus(); return; }

            const ticker  = rawCode.includes('.') ? rawCode : `${rawCode}.T`;
            const overlay = document.getElementById('analysis-overlay');
            const aoBody  = document.getElementById('ao-body');
            const aoTitle = document.getElementById('ao-title');

            aoTitle.textContent = `${rawCode} — 取得中...`;
            aoBody.innerHTML    = '<div class="ao-loading">データを取得しています...</div>';
            overlay.classList.add('visible');

            try {
                // ① 基本クォートデータ
                const qRes  = await fetch(PROXY + encodeURIComponent(`${YF_URL}?symbols=${ticker}`));
                const qJson = await qRes.json();
                const q     = qJson.quoteResponse?.result?.[0];
                if (!q) {
                    aoBody.innerHTML = `<div class="ao-error">「${rawCode}」のデータが見つかりません。<br>証券コードを確認してください。</div>`;
                    return;
                }

                // ② 期間パフォーマンス（並列）
                const perfPeriods = ['1w', '1m', '3m', '6m', '1y', '3y'];
                const perfMap     = {};
                await Promise.all(perfPeriods.map(async p => {
                    const v = await fetchChartOne(ticker, p);
                    perfMap[p] = v ? v.change : null;
                }));

                // ③ 四半期財務データ（v10 quoteSummary）
                let fin = null;
                try {
                    const mods   = 'incomeStatementHistoryQuarterly,balanceSheetHistoryQuarterly,cashflowStatementHistoryQuarterly';
                    const fsRes  = await fetch(PROXY + encodeURIComponent(
                        `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=${mods}`
                    ));
                    const fsJson = await fsRes.json();
                    if (!fsJson.quoteSummary?.error) fin = fsJson.quoteSummary?.result?.[0];
                } catch { /* 取得失敗は許容 */ }

                // ── 値整形ヘルパー
                const N = (v) => extractNum(v);
                const fmtCap = (c) => {
                    if (!c) return '—';
                    return c >= 1e12 ? `${(c/1e12).toFixed(2)}兆円` : `${(c/1e8).toFixed(1)}億円`;
                };
                const fmtPct = (v, tag='span') => {
                    if (v === null || v === undefined || isNaN(v)) return `<${tag} class="ao-perf-val neu">—</${tag}>`;
                    return `<${tag} class="ao-perf-val ${v >= 0 ? 'pos' : 'neg'}">${v >= 0 ? '+' : ''}${v.toFixed(2)}%</${tag}>`;
                };

                const price  = N(q.regularMarketPrice);
                const chgPct = N(q.regularMarketChangePercent);
                const chgAbs = N(q.regularMarketChange);
                const mktCap = N(q.marketCap);
                const per    = N(q.trailingPE);
                const pbr    = N(q.priceToBook);
                const psr    = N(q.priceToSalesTrailing12Months);
                const eps    = N(q.trailingEps);
                const divYld = N(q.dividendYield) * 100;
                const hi52   = N(q.fiftyTwoWeekHigh);
                const lo52   = N(q.fiftyTwoWeekLow);
                const name   = q.longName || q.shortName || rawCode;
                const exch   = q.fullExchangeName || q.exchange || 'TSE';
                const sign   = chgPct >= 0 ? '+' : '';
                const cls    = chgPct >= 0 ? 'pos' : 'neg';

                aoTitle.textContent = `${rawCode}  ${name}`;

                // ── 財務テーブル構築
                const buildFinTable = () => {
                    const incQtrs = fin?.incomeStatementHistoryQuarterly?.incomeStatementHistory || [];
                    const balQtrs = fin?.balanceSheetHistoryQuarterly?.balanceSheetStatements   || [];
                    const cfQtrs  = fin?.cashflowStatementHistoryQuarterly?.cashflowStatements  || [];

                    if (!incQtrs.length) {
                        return `<div class="ao-note" style="text-align:left;color:#555;padding:1rem;">
                            四半期財務データは Yahoo Finance から取得できませんでした。<br>
                            （API制限）直近の決算情報は各社 IR ページをご参照ください。
                        </div>`;
                    }

                    // 日付をキーにデータをマージ
                    const byDate = {};
                    incQtrs.forEach(r => {
                        const d = r.endDate?.fmt; if (!d) return;
                        byDate[d] = byDate[d] || { date: d };
                        byDate[d].rev    = N(r.totalRevenue)    / 1e6;
                        byDate[d].opInc  = N(r.operatingIncome) / 1e6;
                        byDate[d].netInc = N(r.netIncome)       / 1e6;
                    });
                    balQtrs.forEach(r => {
                        const d = r.endDate?.fmt; if (!d || !byDate[d]) return;
                        byDate[d].assets  = N(r.totalAssets)              / 1e6;
                        byDate[d].equity  = N(r.totalStockholderEquity)   / 1e6;
                        byDate[d].shares  = N(r.commonStockSharesOutstanding || r.commonStock);
                    });
                    cfQtrs.forEach(r => {
                        const d = r.endDate?.fmt; if (!d || !byDate[d]) return;
                        byDate[d].opCF   = N(r.operatingCashflow)                     / 1e6;
                        byDate[d].invCF  = N(r.totalCashflowsFromInvestingActivities  || r.capitalExpenditures) / 1e6;
                        byDate[d].finCF  = N(r.totalCashFromFinancingActivities)       / 1e6;
                        byDate[d].cash   = N(r.endCashPosition || r.changeInCash)      / 1e6;
                    });

                    // 日付昇順ソート（古い→新しい）
                    const rows = Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));

                    // 自己資本比率を計算
                    rows.forEach(r => {
                        r.eqRatio = (r.assets && r.equity) ? (r.equity / r.assets * 100).toFixed(1) : null;
                    });

                    // 四半期単独値を計算（累積→単独：日本会計基準対応）
                    // 累積値が前期より小さくなる = 新年度開始 → その期は単独値＝累積値そのもの
                    rows.forEach((r, i) => {
                        if (i === 0) {
                            r.qRev = r.rev; r.qOpInc = r.opInc; r.qNetInc = r.netInc;
                        } else {
                            const prev = rows[i - 1];
                            const isNewFY = (r.rev !== null && prev.rev !== null && r.rev < prev.rev);
                            r.qRev    = isNewFY ? r.rev    : (r.rev    !== null && prev.rev    !== null ? r.rev    - prev.rev    : null);
                            r.qOpInc  = isNewFY ? r.opInc  : (r.opInc  !== null && prev.opInc  !== null ? r.opInc  - prev.opInc  : null);
                            r.qNetInc = isNewFY ? r.netInc : (r.netInc !== null && prev.netInc !== null ? r.netInc - prev.netInc : null);
                        }
                    });

                    // 表示は降順（新しい→古い）
                    rows.reverse();

                    const m = (v, d=0) => {
                        if (v === null || v === undefined || isNaN(v) || v === 0) return '<span class="dim">—</span>';
                        const s = v < 0 ? 'neg' : '';
                        return `<span class="${s} num">${Math.round(v).toLocaleString()}</span>`;
                    };
                    const pct = (v) => v !== null ? `<span class="dim">${v}%</span>` : '<span class="dim">—</span>';
                    const shs = (v) => v ? v.toLocaleString() : '<span class="dim">—</span>';

                    const tableRows = rows.map((r, i) => {
                        const isFYStart = i > 0 && r.rev !== null && rows[i-1].rev !== null && rows[i-1].rev < r.rev;
                        return `<tr class="${isFYStart ? 'fy-start' : ''}">
                            <td>${r.date}</td>
                            <td class="num">${m(r.rev)}</td>
                            <td>${m(r.opInc)}</td>
                            <td>${m(r.netInc)}</td>
                            <td class="group-sep">${m(r.assets)}</td>
                            <td>${m(r.equity)}</td>
                            <td class="num">${pct(r.eqRatio)}</td>
                            <td class="num">${shs(r.shares)}</td>
                            <td class="group-sep">${m(r.opCF)}</td>
                            <td>${m(r.invCF)}</td>
                            <td>${m(r.finCF)}</td>
                            <td>${m(r.cash)}</td>
                            <td class="group-sep">${m(r.qRev)}</td>
                            <td>${m(r.qOpInc)}</td>
                            <td>${m(r.qNetInc)}</td>
                        </tr>`;
                    }).join('');

                    return `
                        <div class="ao-note">単位: 百万円 ／ 自己資本比率は純資産÷総資産で算出</div>
                        <div class="fin-table-wrap">
                          <table class="fin-table">
                            <thead>
                              <tr class="group-header">
                                <th colspan="1"></th>
                                <th colspan="3" style="text-align:center;color:#00cc88;border-bottom:1px solid #1e1e1e;">─── 損益 ───</th>
                                <th colspan="4" class="group-sep" style="text-align:center;color:#5599ff;border-bottom:1px solid #1e1e1e;">─── 財政状態 ───</th>
                                <th colspan="4" class="group-sep" style="text-align:center;color:#ffaa44;border-bottom:1px solid #1e1e1e;">─── キャッシュフロー ───</th>
                                <th colspan="3" class="group-sep" style="text-align:center;color:#cc88ff;border-bottom:1px solid #1e1e1e;">─── 四半期単独 ───</th>
                              </tr>
                              <tr>
                                <th>期末</th>
                                <th>売上高</th><th>営業利益</th><th>純利益</th>
                                <th class="group-sep">総資産</th><th>純資産</th><th>自己資本比率</th><th>株数</th>
                                <th class="group-sep">営業CF</th><th>投資CF</th><th>財務CF</th><th>現金等</th>
                                <th class="group-sep">売上高Q</th><th>営業利益Q</th><th>純利益Q</th>
                              </tr>
                            </thead>
                            <tbody>${tableRows}</tbody>
                          </table>
                        </div>`;
                };

                aoBody.innerHTML = `
                    <!-- ① メトリクスバー -->
                    <div class="ao-metrics-bar">
                        <div class="ao-price-block">
                            <span class="ao-price">¥${price.toLocaleString('ja-JP', {maximumFractionDigits: price < 100 ? 2 : 0})}</span>
                            <span class="ao-chg ${cls}">${sign}${chgPct.toFixed(2)}%　${sign}¥${Math.abs(chgAbs).toFixed(0)}</span>
                            <div style="font-size:0.7rem;color:#444;margin-top:2px;">${exch}</div>
                        </div>
                        <div class="ao-metrics-grid">
                            <div class="ao-metric"><span>時価総額</span><strong>${fmtCap(mktCap)}</strong></div>
                            ${psr   ? `<div class="ao-metric"><span>PSR</span><strong>${psr.toFixed(2)}</strong></div>` : ''}
                            ${per   ? `<div class="ao-metric"><span>PER（実績）</span><strong>${per.toFixed(2)}倍</strong></div>` : ''}
                            ${pbr   ? `<div class="ao-metric"><span>PBR</span><strong>${pbr.toFixed(2)}倍</strong></div>` : ''}
                            ${eps   ? `<div class="ao-metric"><span>EPS</span><strong>¥${eps.toFixed(2)}</strong></div>` : ''}
                            ${divYld > 0 ? `<div class="ao-metric"><span>配当利回り</span><strong>${divYld.toFixed(2)}%</strong></div>` : ''}
                            <div class="ao-metric"><span>52W 高値</span><strong>¥${hi52.toLocaleString()}</strong></div>
                            <div class="ao-metric"><span>52W 安値</span><strong>¥${lo52.toLocaleString()}</strong></div>
                        </div>
                    </div>

                    <!-- ② 期間パフォーマンス -->
                    <div class="ao-section-title">期間別パフォーマンス</div>
                    <div class="ao-perf-row">
                        ${[['1w','1週'],['1m','1ヶ月'],['3m','3ヶ月'],['6m','6ヶ月'],['1y','1年'],['3y','3年']].map(([p, lbl]) =>
                            `<div class="ao-perf-cell">
                                <div class="ao-perf-period">${lbl}</div>
                                ${fmtPct(perfMap[p])}
                            </div>`
                        ).join('')}
                    </div>

                    <!-- ③ 四半期財務テーブル -->
                    <div class="ao-section-title">四半期財務データ（累積＋単独換算）</div>
                    ${buildFinTable()}
                `;

            } catch (e) {
                console.error('analyzeStock error:', e);
                aoBody.innerHTML = `<div class="ao-error">エラーが発生しました。<br>しばらく経ってから再試行してください。</div>`;
            }
        }
    </script>

    <!-- 銘柄分析フルスクリーンオーバーレイ -->
    <div id="analysis-overlay" class="analysis-overlay">
        <div class="ao-topbar">
            <button class="ao-back-btn" onclick="closeAnalysisOverlay()">← 戻る</button>
            <div class="ao-title" id="ao-title">銘柄分析</div>
            <div></div>
        </div>
        <div class="ao-body" id="ao-body">
            <div style="text-align:center;color:#444;padding:4rem;font-size:1rem;">
                証券コードを入力して「分析」を押してください
            </div>
        </div>
    </div>

</body>
</html>
